[project]
name = "hoyohelper"
version = "0.1.0"
description = "Automated HoYoLAB daily check-in helper with Discord webhook reporting."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=46.0.3",
    "pillow",
    "playwright>=1.57.0",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# The project root must be importable so tests can use `app.lib.*` package imports.
pythonpath = ["."]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error::DeprecationWarning:app.*",
]
